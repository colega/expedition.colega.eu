# Publica el visor en GitHub Pages en cada push a main: pasa las pruebas,
# construye el modelo, para no publicar un modelo que no pasa las
# comprobaciones, y deja el visor en dist/ como pagina estatica.
name: Visor en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prueba
      - run: npm run construir
      - run: npm run visor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # deploy-pages pregunta por el artefacto nada mas arrancar, y el servicio
      # de artefactos a veces tarda unos segundos en listarlo (nos ha pasado en
      # tres de los ultimos cuatro pushes): se le da su tiempo, mirando cada 5
      # segundos hasta dos minutos.
      - name: Espera al artefacto
        run: |
          for i in $(seq 24); do
            if curl -sf -H "Authorization: Bearer ${{ github.token }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" \
                | jq -e '.total_count > 0'; then
              echo "el artefacto esta a la vista (intento $i)"
              exit 0
            fi
            sleep 5
          done
          echo "el artefacto no aparece en la API"
          exit 1
        timeout-minutes: 3
      - id: despliegue
        uses: actions/deploy-pages@v4
