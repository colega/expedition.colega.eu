<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atego 4x4</title>
  <style>
    :root {
      --fondo: #eef0ec;
      --panel: #ffffff;
      --hundido: #f3f5f0;      /* fondo de los grupos de botones */
      --texto: #1d211b;
      --suave: #6a7066;
      --linea: #dfe3da;
      --acento: #4d543d;
      --sobre-acento: #ffffff;
      --resalte: #e6ebd9;
      --pista: #c9cec1;        /* carril de los interruptores */
      --sombra: 0 1px 2px rgba(29, 33, 27, .08), 0 4px 14px rgba(29, 33, 27, .08);
      --radio: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #1b1d19;
        --panel: #242720;
        --hundido: #1d201a;
        --texto: #e6e9e1;
        --suave: #9aa093;
        --linea: #383c33;
        --acento: #b9c39a;
        --sobre-acento: #1b1d19;
        --resalte: #343a2b;
        --pista: #4a4f42;
        --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .3);
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--fondo); color: var(--texto);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid; grid-template-columns: 340px 1fr; overflow: hidden;
    }

    /* ------------------------------------------------------------ panel */
    aside {
      background: var(--panel); border-right: 1px solid var(--linea);
      display: flex; flex-direction: column; min-height: 0; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: var(--pista) transparent;
    }
    header {
      position: sticky; top: 0; z-index: 2; background: var(--panel);
      padding: 16px 16px 12px; border-bottom: 1px solid var(--linea);
    }
    .titulo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    h1 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
    #estado { color: var(--suave); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .bloque { padding: 14px 16px; border-bottom: 1px solid var(--linea); }
    .bloque h2 {
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
      color: var(--suave); margin: 0 0 8px;
    }

    /* ---------------------------------------------------------- botones */
    button {
      font: inherit; font-size: 12.5px; color: var(--texto); background: var(--panel);
      border: 1px solid var(--linea); border-radius: var(--radio); padding: 6px 10px; min-height: 30px;
      cursor: pointer; transition: background-color .12s, border-color .12s, color .12s;
    }
    button:hover:not(:disabled) { background: var(--resalte); }
    button:active:not(:disabled) { transform: translateY(.5px); }
    button:disabled { opacity: .5; cursor: default; }
    button[aria-pressed="true"] { background: var(--acento); color: var(--sobre-acento); border-color: var(--acento); }
    :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

    /* un grupo de botones en una sola pieza */
    .segmentado {
      display: flex; gap: 2px;
      background: var(--hundido); border: 1px solid var(--linea); border-radius: calc(var(--radio) + 3px); padding: 3px;
    }
    /* cada boton ancho segun su texto, y el sobrante repartido a partes iguales */
    .segmentado button { flex: 1 1 auto; border: 0; background: transparent; padding: 6px 8px; border-radius: var(--radio); }
    .segmentado button:hover:not(:disabled) { background: var(--panel); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }

    .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    /* rampa y ducha: el nombre y, debajo, como esta */
    .par { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 7px 12px; text-align: left; }
    .par-nombre { font-weight: 600; }
    .par-estado { font-size: 11.5px; opacity: .75; }

    /* ---------------------------------------------------- interruptores */
    .interruptores { border: 1px solid var(--linea); border-radius: calc(var(--radio) + 2px); overflow: hidden; }
    .fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; cursor: pointer; }
    .fila + .fila { border-top: 1px solid var(--linea); }
    .fila:hover { background: var(--hundido); }
    input.interruptor {
      appearance: none; -webkit-appearance: none; flex: none; margin: 0; cursor: pointer;
      width: 34px; height: 20px; border-radius: 10px; background: var(--pista); position: relative;
      transition: background-color .15s;
    }
    input.interruptor::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .15s;
    }
    input.interruptor:checked { background: var(--acento); }
    input.interruptor:checked::after { transform: translateX(14px); }

    /* ------------------------------------------------------------ color */
    .fila-color { display: flex; align-items: center; gap: 10px; }
    .fila-color label { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
    input[type=color] {
      width: 36px; height: 30px; padding: 2px; border: 1px solid var(--linea); border-radius: var(--radio);
      background: var(--panel); cursor: pointer;
    }
    input[type=color]:disabled { opacity: .5; cursor: default; }

    /* ------------------------------------------------------------ vistas */
    select {
      width: 100%; font: inherit; font-size: 13px; color: var(--texto); background: var(--panel);
      border: 1px solid var(--linea); border-radius: var(--radio); padding: 6px 8px; min-height: 32px; cursor: pointer;
    }

    /* ------------------------------------------------------------ medir */
    .pista { color: var(--suave); font-size: 12px; margin-top: 8px; }
    .pista:empty { display: none; }
    #medidas { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; font-variant-numeric: tabular-nums; }
    #medidas:empty { display: none; }
    #medidas li { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 3px 0; }
    #medidas li + li { border-top: 1px solid var(--linea); }
    #medidas li button, .etiqueta button { border: 0; background: transparent; min-height: 0; padding: 0 4px; font-size: 14px; line-height: 1; color: var(--suave); }
    #etiquetas { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .etiqueta {
      position: absolute; left: 0; top: 0; pointer-events: auto; white-space: nowrap;
      background: var(--panel); border: 1px solid #e0601f; border-radius: var(--radio); padding: 2px 4px 2px 8px;
      font-size: 12px; font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center;
      box-shadow: var(--sombra);
    }
    .etiqueta span { color: var(--suave); font-size: 11px; }

    /* ------------------------------------------------------- componentes */
    #verArbol {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      border: 0; background: transparent; padding: 0; min-height: 0; border-radius: 4px;
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--suave);
    }
    #verArbol:hover:not(:disabled) { background: transparent; color: var(--texto); }
    #verArbol::after { content: "▸"; font-size: 13px; transition: transform .15s; }
    #verArbol[aria-expanded="true"]::after { transform: rotate(90deg); }
    #arbol { margin-top: 8px; }
    details { margin-left: 14px; }
    #arbol > details { margin-left: 0; }
    summary {
      list-style: none; cursor: pointer; padding: 2px 6px; border-radius: 6px; white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "▸"; width: 10px; color: var(--suave); font-size: 10px; flex: none; }
    details[open] > summary::before { content: "▾"; }
    details.hoja > summary::before { content: ""; }
    summary .n { color: var(--suave); font-size: 11px; font-variant-numeric: tabular-nums; }
    .cuerpo { margin-left: 16px; display: flex; gap: 6px; align-items: center; white-space: nowrap; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
    summary:hover, .cuerpo:hover { background: var(--hundido); }
    .cuerpo.elegido, summary.elegido { background: var(--resalte); }
    input[type=checkbox] { margin: 0; accent-color: var(--acento); }

    /* ---------------------------------------------------------- modelo */
    main { position: relative; min-width: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #info {
      position: absolute; left: 16px; bottom: 16px; max-width: calc(100% - 32px);
      background: var(--panel); border: 1px solid var(--linea); border-radius: calc(var(--radio) + 2px);
      box-shadow: var(--sombra); padding: 10px 12px; display: none; font-size: 12px;
    }
    #info .nombre { font-weight: 600; }
    #info .ruta { color: var(--suave); }
    #info .medidas { font-variant-numeric: tabular-nums; margin-top: 3px; }
    #info button { margin-top: 8px; }
    #error { white-space: pre-wrap; color: #b3261e; font: 12px ui-monospace, monospace; padding: 8px 16px; display: none; }
    #plegar { display: none; }

    /* En el movil el modelo va arriba y el panel debajo, que se desplaza entero,
       arbol incluido. Las vistas fijas no salen: con el dedo se gira mejor.
       Panel lo pliega para ver el modelo a pantalla completa. */
    @media (max-width: 700px) {
      body { height: 100dvh; grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
      main { order: 1; min-height: 0; }
      aside { order: 2; height: 45dvh; border-right: 0; border-top: 1px solid var(--linea); }
      .bloque-vistas { display: none; }
      aside.plegado { height: auto; overflow: visible; }
      aside.plegado > :not(header) { display: none; }
      aside.plegado header { border-bottom: 0; }
      #plegar { display: inline-block; }
      button { padding: 8px 10px; font-size: 13px; }
      .segmentado button { padding: 8px 6px; }
      input[type=checkbox]:not(.interruptor) { width: 18px; height: 18px; }
      summary, .cuerpo { padding: 5px 6px; }
      #info { bottom: 8px; left: 8px; right: 8px; max-width: none; }
    }
  </style>
</head>
<body>
  <aside id="lateral">
    <header>
      <div class="titulo">
        <h1>Atego 4x4</h1>
        <button id="plegar" aria-expanded="true">Panel</button>
      </div>
      <div id="estado">Arrancando OpenCascade…</div>
    </header>

    <section class="bloque">
      <h2>Mostrar</h2>
      <div class="segmentado">
        <button id="mostrarTodo" title="Todo el camión, con el paisaje">Todo</button>
        <button id="soloInterior" title="Solo el interior y la puerta lateral">Interior</button>
        <button id="soloBano" title="Solo el baño">Baño</button>
        <button id="soloCocina" title="Solo la cocina">Cocina</button>
        <button id="soloComedor" title="Solo el comedor">Comedor</button>
      </div>
    </section>

    <section class="bloque" id="abrir" hidden>
      <h2>Abrir y cerrar</h2>
      <div class="dos">
        <button id="rampa" class="par" aria-pressed="false" hidden>
          <span class="par-nombre">Rampa</span><span class="par-estado"></span>
        </button>
        <button id="ducha" class="par" aria-pressed="false" hidden>
          <span class="par-nombre">Ducha</span><span class="par-estado"></span>
        </button>
      </div>
    </section>

    <section class="bloque">
      <h2>Escena</h2>
      <div class="interruptores">
        <label class="fila"><span>Paisaje</span><input type="checkbox" class="interruptor" id="paisaje" role="switch" checked></label>
        <label class="fila"><span>Aristas</span><input type="checkbox" class="interruptor" id="aristas" role="switch" checked></label>
        <label class="fila"><span>Suelo</span><input type="checkbox" class="interruptor" id="suelo" role="switch" checked></label>
      </div>
    </section>

    <section class="bloque">
      <h2>Color</h2>
      <div class="fila-color">
        <label><input type="color" id="color" disabled><span>Caja y cabina</span></label>
        <button id="colorOriginal" disabled>Original</button>
      </div>
    </section>

    <section class="bloque">
      <h2>Medir</h2>
      <div class="dos">
        <button id="medir" aria-pressed="false">Entre aristas</button>
        <button id="borrarMedidas">Borrar medidas</button>
      </div>
      <div id="pista" class="pista"></div>
      <ol id="medidas"></ol>
    </section>

    <section class="bloque bloque-vistas">
      <h2>Vista</h2>
      <select id="vistas" aria-label="Vista"></select>
    </section>

    <div id="error"></div>

    <section class="bloque">
      <button id="verArbol" aria-expanded="false" aria-controls="arbol">Componentes</button>
      <div id="arbol" hidden></div>
    </section>
  </aside>
  <main>
    <canvas id="lienzo"></canvas>
    <div id="etiquetas"></div>
    <div id="info">
      <div class="nombre"></div>
      <div class="ruta"></div>
      <div class="medidas"></div>
      <button id="ocultarElegido">Ocultar</button>
    </div>
  </main>
  <script type="module" src="./visor.js"></script>
</body>
</html>
